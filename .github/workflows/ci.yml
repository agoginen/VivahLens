name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # node:sqlite needs 22.13+ (no flag); 24 is the current development version.
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Licence gate and NOTICE
        run: npm run licenses
      - name: EditRecipe JSON Schema is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.x'
        run: |
          npm run schema
          git diff --exit-code -- packages/core/schema
